# DrobeBook — production config for Railway
client_id = "5304540515ef529204bacd597f500688"
name = "DrobeBook"
application_url = "https://drobebook-production.up.railway.app/app"
embedded = true

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2025-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = ["orders/create"]
  uri = "/webhooks/orders/create"

  [[webhooks.subscriptions]]
  topics = ["orders/cancelled"]
  uri = "/webhooks/orders/cancelled"

  [[webhooks.subscriptions]]
  topics = ["refunds/create"]
  uri = "/webhooks/refunds/create"

  [[webhooks.subscriptions]]
  topics = ["customers/data_request"]
  uri = "/webhooks/customers/data_request"

  [[webhooks.subscriptions]]
  topics = ["customers/redact"]
  uri = "/webhooks/customers/redact"

  [[webhooks.subscriptions]]
  topics = ["shop/redact"]
  uri = "/webhooks/shop/redact"

[access_scopes]
scopes = "write_app_proxy,read_products,read_orders,write_orders,write_draft_orders,read_customers,write_customers,read_inventory,write_discounts"

[auth]
redirect_urls = [
  "https://drobebook-production.up.railway.app/auth/callback",
  "https://drobebook-production.up.railway.app/auth/shopify/callback",
]

[app_proxy]
url = "/apps/gk-drobe"
prefix = "apps"
subpath = "gk-drobe"
