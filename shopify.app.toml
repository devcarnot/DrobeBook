# DrobeBook — GK.Drobe booking app
client_id = "27d4e102059dee2122a57d3f1cc57057"
name = "DrobeBook"
application_url = "https://ringtones-lighter-surprising-contamination.trycloudflare.com/app"
embedded = true

[build]
automatically_update_urls_on_dev = true

[events]
api_version = "unstable"

[[events.subscription]]
handle = "product-updates"
topic = "Product"
actions = ["create", "update", "delete"]
uri = "/webhooks/events/products"

[webhooks]
api_version = "2025-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

[access_scopes]
scopes = "write_app_proxy,read_products,read_orders"

[auth]
redirect_urls = [
  "https://ringtones-lighter-surprising-contamination.trycloudflare.com/auth/callback",
  "https://ringtones-lighter-surprising-contamination.trycloudflare.com/auth/shopify/callback",
]

[app_proxy]
url = "/apps/gk-drobe"
prefix = "apps"
subpath = "gk-drobe"
